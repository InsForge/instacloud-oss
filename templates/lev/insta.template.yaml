code: lev
version: 0.1.1
maintainer: official
sourceRepo: InsForge/instacloud-oss

upstream:
  repo: Abhinavexists/lev
  # No releases and no git tags upstream, so the commit IS the pin. ./Dockerfile installs this
  # exact commit; the two must move together. `pinned` carries the package version that commit
  # declares, which is what an operator sees in `/health`.
  commit: cf104b69329302e4eac674a730c71f3511047db8
  pinned: "0.1.1"
  # The decision quality is the adapter's, not the backbone's, and the two are versioned apart.
  # Qwen3.5-4B, not -4B-Base: `lev serve` defaults to the base model, and the release's
  # lev_release.json overrides it, which the server says out loud on every boot ("release manifest
  # names base 'Qwen/Qwen3.5-4B'; using it instead of 'Qwen/Qwen3.5-4B-Base'").
  model: interfaze-ai/lev (LoRA adapter + Mode B head + calibration, on Qwen/Qwen3.5-4B)
  license: Apache-2.0

services:
  lev:
    type: web
    image: ghcr.io/insforge/insta-oss/templates/lev:0.1.1   # built from ./Dockerfile by templates-build-images.yml
    port: 8080
    # Upstream's own liveness route, and the only one that can serve as the gate. There is no route
    # at `/` in lev's server (this template's serve.py adds a redirect there for humans), and
    # `/v1/systemone` is a POST behind the key. `/health` answers 200 the moment uvicorn binds,
    # reporting `{"status": "loading"}` until the backbone is mapped, which is what lets a first
    # boot pass a 90-second gate while it is still fetching 9.3 GB from the Hub. serve.py turns it
    # into a 503 if that fetch fails, so a load that can never finish fails the deploy rather than
    # passing it.
    healthcheck: /health
    # Not scale-to-zero, and not a preference. An idle volume-bearing service is STOPPED, so the
    # next request pays a cold start plus a fresh map of the backbone off the disk, and the edge in
    # front of a compute service cuts the connection at 60 seconds. Measured over two restarts of
    # this template: 65 and 69 s from boot to a loaded engine, then a first decision of 36 s on one
    # and over 60 s on the other, while the forward pass faults the weights in. The second restart
    # put the first decision past the limit on its own and the edge returned a 502, so the pair
    # does not merely add up past 60 s, it can exceed it unaided: every first request after an idle
    # period would be cut off. It bills around the clock, which the README's Limits section and
    # FAQ both say out loud. The measurements behind these numbers are on PR #187.
    alwaysOn: true
    # The Hub cache, and the reason a restart is cheap. 9.3 GB of backbone, 170 MB of adapter and a
    # 15 MB Mode B head: 8.9 GiB on the disk, fetched once per deployment instead of once per
    # restart. Measured on a restart, both fetches were cache hits and nothing touched the Hub.
    # Baking them into the image instead, the way laya bakes its 842 MB checkpoint, is not an
    # option at this size: it is an image nothing would cache and every machine would pull whole
    # on every deploy. Nothing else is written here; a decision is state in, answer out.
    volume: true
    env:
      fixed:
        PORT: "8080"
        # On the volume, which is the whole reason the volume exists.
        HF_HOME: /data/hf
        # What gets served: a release directory, a Hub id, or empty for the untrained backbone.
        # This is the released adapter, and it is the thing being templated. It is a manifest
        # variable rather than a constant in serve.py so that repointing it never needs a new
        # image. Whether `fixed` is the right group is open: the claim that an operator can edit
        # it after deploy has not been verified against the console, so neither this comment nor
        # the README asserts it any more. Raised on PR #193, and the unresolved half of it is the
        # cubic finding on PR #187.
        LEV_CHECKPOINT: interfaze-ai/lev
        # The platform's compute machines are 8 shared vCPUs at the ceiling, and a forward pass
        # here is CPU-bound across all of them.
        OMP_NUM_THREADS: "8"
        # transformers probes for TensorFlow at import and its abseil runtime can deadlock model
        # construction. laya's image sets the same pair for the same reason; lev is torch-only.
        USE_TF: "0"
        USE_TORCH: "1"
        TOKENIZERS_PARALLELISM: "false"
      required:
        # Neither a `default:` nor a `generate:`, matching laya, which is the same shape of thing:
        # an inference endpoint consumed programmatically. Every request is a forward pass through
        # a 4B model, so an unauthenticated one is a free compute faucet for whoever finds the URL.
        # A key written here would be the same one on every deploy in the world, and a generated
        # one would be stored write-only where the operator could never read it back. The console
        # renders one empty field and will not submit until it is filled.
        API_KEY:
          description: "Paste an API key of your choosing; it guards every route except /health. Send `Authorization: Bearer <key>`, or HTTP basic auth with username `api` and the key as the password. A TypeSafe SDK client points its `api_key` at the same value"
      optional:
        # The backbone and the adapter are both public, so a token is not needed to deploy. It is
        # here for the operator who has repointed LEV_CHECKPOINT at a private release of their own.
        HF_TOKEN:
          description: "Hugging Face access token, needed only when LEV_CHECKPOINT names a private repository. Leave blank for the released public adapter"

meta:
  name: lev
  # Names the thing, not the property. The previous line said what the output is like ("typed,
  # calibrated decisions from one forward pass and zero output tokens") and never said it was a
  # decision model, which is the one word a gallery card has to land.
  tagline: Open System One decision model with a Jev-compatible API
  category: llm
  tags: [llm, ai]
  # amd64 only, declared rather than hoped for. The CPU torch wheels exist for aarch64, but nobody
  # has run the arm64 leg, and the interesting part of this image is a 4B bf16 forward pass whose
  # kernels are exactly what would have to be proved there. See the Architectures table in
  # ../README.md for what adding the second row would take.
  architectures: [amd64]
  # Published. It was a draft over one open question, whether an always-on machine billing around
  # the clock for a 4 to 6 second CPU decision belongs in the gallery, and that was settled yes.
  # The cost is not hidden from it: the README's Limits section and FAQ say always-on, say it is
  # charged the whole time, and say to delete the service when you are done. Everything the draft
  # note used to carry is now in those two sections, which is where a reader looks anyway.
  draft: false
  # Upstream HAS a mark, and an earlier draft of this file was wrong to say otherwise: the "lev."
  # wordmark, near-black #14181F glyphs with a #2A78D6 dot. What upstream does not do is publish it
  # on its own. It exists only baked into hf/assets/hero.png (3200x1120) and hf/assets/
  # social-card.png (1200x630), both sitting on an opaque #FAFAF8 plate, and a recursive listing of
  # the repository turns up no standalone file, no transparent copy and no favicon. interfaze.ai
  # serves interfaze_app_icon.svg, which is Interfaze's mark and not lev's, and no third-party
  # listing carries a copy either. Cutting the wordmark out of a banner is exactly what "do not
  # hand-cut one" in ../AGENTS.md forbids, so this stays `none` and consumers fall back to a
  # monogram. Recorded in the logo attribution table in ../README.md. Revisit if upstream ever
  # publishes the mark as its own file.
  logo: none
  links:
    upstream: https://github.com/Abhinavexists/lev
    model: https://huggingface.co/interfaze-ai/lev
    benchmarks: https://github.com/Abhinavexists/lev/blob/main/docs/FINDINGS.md
