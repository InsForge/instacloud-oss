code: claude-code
version: 0.8.3
maintainer: official
sourceRepo: InsForge/insta-oss

upstream:
  package: "@anthropic-ai/claude-code"
  pinned: "2.1.235"
  license: LicenseRef-Anthropic-Commercial-Terms

services:
  # Named for the template, not "workspace": three templates sharing one service name collided on
  # the same branch, the second overwriting the first (QA.md finding 1).
  claude-code:
    type: web
    image: ghcr.io/insforge/insta-oss/templates/claude-code:0.8.3   # built from ./Dockerfile by templates-build-images.yml
    port: 7681
    healthcheck: /
    # No `spec:`, so the platform's birth size applies. Worth keeping from when this asked for
    # 1 GB: 2vcpu-2gb was tried on a live deployment against a ~30s first-response complaint and
    # made no difference, so that cost is not memory or core count and a bigger machine will not
    # fix it.
    # No alwaysOn: the browser reaches this INBOUND, so wake-on-request works (hermes and n8n
    # cannot). Costs a ~25s cold boot, and an agent left running with no browser is stopped.
    volume: true  # mounts at /data
    env:
      fixed:
        HOME: /data/home
      required:
        # Neither a `default:` nor a `generate:`, so the deploy form shows two empty required fields
        # and cannot be submitted until the operator fills them. That is deliberate: this service is
        # a root shell in a browser, and a credential shipped in this file would be the same one on
        # every deploy in the world. Nothing here can be left to a fallback.
        ADMIN_USERNAME:
          description: "Username for the browser terminal sign-in"
        ADMIN_PASSWORD:
          description: "Password for the browser terminal sign-in"
      optional:
        ANTHROPIC_API_KEY:
          description: "Anthropic API key. Leave blank and run `claude login` in the terminal instead"

meta:
  name: Claude Code
  tagline: Anthropic's coding agent, editing files and running commands in a browser terminal
  category: ai-agent
  tags: [ai-agent, ai]
  # Architectures the published image carries. A box on anything else is told at deploy time
  # rather than left to fail on the pull: the node base and the ttyd asset both carry aarch64, and
  # both arches build and start.
  architectures: [amd64, arm64]
  logo: ./logo.svg
  links:
    upstream: https://github.com/anthropics/claude-code
    documentation: https://code.claude.com/docs
