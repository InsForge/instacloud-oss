<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="Laya">
  <title>Laya</title>
  <desc>A decision fork: one input path splits into a strong branch and a faint branch,
  their endpoints sized by probability - the typed decision made visible.</desc>
  <g fill="none" stroke-linecap="round">
    <path d="M 7 32 H 25" stroke="#2a78d6" stroke-width="6"/>
    <path d="M 25 32 C 35 32 37 17 48 13" stroke="#2a78d6" stroke-width="6"/>
    <path d="M 25 32 C 35 32 37 47 48 51" stroke="#a7c9ef" stroke-width="4"/>
    <circle cx="52" cy="12" r="7.5" fill="#2a78d6"/>
    <circle cx="52" cy="52" r="4.5" fill="#a7c9ef"/>
  </g>
</svg>
