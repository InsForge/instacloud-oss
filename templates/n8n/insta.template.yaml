code: n8n
version: 1.3.2
maintainer: official
sourceRepo: InsForge/insta-oss

# Sustainable Use License: reference the official image only, and never rebuild or rebrand it.
upstream:
  repo: n8n-io/n8n
  image: docker.io/n8nio/n8n
  pinned: "2.36.5"
  license: LicenseRef-n8n-Sustainable-Use-License

generated:
  encryption_key: secret:32

services:
  n8n:
    type: web
    image: docker.io/n8nio/n8n:2.36.5
    port: 5678
    healthcheck: /healthz
    # Schedule and polling triggers fire from inside the process, so an idle machine never wakes.
    alwaysOn: true
    # n8n defaults to SQLite, and N8N_USER_FOLDER below puts that file on this volume.
    volume: true
    env:
      fixed:
        N8N_USER_FOLDER: /data
        N8N_PORT: "5678"
        N8N_LISTEN_ADDRESS: 0.0.0.0
        N8N_PROXY_HOPS: "1"
        N8N_WEBHOOK_URL: ${services.n8n.url}
        N8N_EDITOR_BASE_URL: ${services.n8n.url}
      generated:
        N8N_ENCRYPTION_KEY: ${encryption_key}

meta:
  name: n8n
  tagline: Visual workflow automation with 400+ integrations
  category: automation
  tags: [automation, ai]
  # Architectures the published image carries. A box on anything else is told at deploy time
  # rather than left to fail on the pull: the official image publishes both and nothing is rebuilt
  # here.
  architectures: [amd64, arm64]
  logo: ./logo.svg
  links:
    upstream: https://github.com/n8n-io/n8n
    documentation: https://docs.n8n.io
