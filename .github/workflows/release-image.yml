name: release-image

# Publishes ghcr.io/insforge/instacloud for linux/amd64 and linux/arm64 on a version tag.
# Release flow: `npm version x.y.z` commits and tags vx.y.z on main; pushing the tag runs this job.
# The tag must equal v<package.json version> (package.json is the release source of truth).
# install.sh resolves the newest GitHub RELEASE (not the newest tag), so publishing the release is
# what makes an upgrade visible to `sh install.sh`; a prerelease (v0.3.0-rc.1) gets no `latest`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing v* tag to rebuild
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: tag must equal v<package.json version>
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$v" ] || { echo "tag $TAG != package.json $v"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/insforge/instacloud
          # metadata-action reads the version from the git tag on push events; for
          # workflow_dispatch the checked-out tag is passed explicitly through the raw types.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
