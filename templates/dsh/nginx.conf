# The auth gate in front of the harness web UI, which ships no authentication of its own.
# Only this server faces the network; dsh stays on 127.0.0.1.
# Rendered at boot: entrypoint.sh substitutes __DSH_GATE_TOKEN__ with a digest of the admin credentials.
# The token must be a literal here because nginx can only compare strings, not hash one.

# No `user` directive: the image runs unprivileged, so there is no root master to drop from, and
# nginx refuses the directive outright. Workers inherit the entrypoint's uid.
worker_processes 1;
pid /run/dsh/nginx.pid;
# `stderr`, not `/dev/stderr`: the literal writes to the descriptor nginx already holds, while the
# path is a symlink to /proc/self/fd/2 that has to be REOPENED. The entrypoint starts as root to
# repair volume ownership and then drops, so by the time nginx runs, fd 2 belongs to a device the
# unprivileged process may no longer open, and nginx exits with "open() /dev/stderr failed (13)".
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;
    default_type application/octet-stream;
    include /etc/nginx/mime.types;

    # Debian compiles these under /var/lib/nginx, which only root may write. All five are set, not
    # just the two this config uses: nginx creates every temp directory at startup and exits if it
    # cannot, so an unset one fails the boot rather than the request that would have needed it.
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    scgi_temp_path /tmp/nginx/scgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;

    # The gate maps key on a 64-character digest, which does not fit the default 64-byte bucket.
    # Load-bearing: nginx refuses to start rather than degrade, leaving dsh up behind no listener.
    map_hash_bucket_size 128;

    # WebSocket carries the two server-to-browser event streams the UI needs to render a turn.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Why a cookie exists at all: `new WebSocket()` takes no headers, so only credentials the
    # engine attaches by itself can authenticate a handshake, and nothing requires it to reuse
    # its HTTP auth cache there. Measured with a page holding valid basic credentials, Chromium
    # and Firefox attach them and WebKit sends none.
    # An engine that sends none 401s both /api/events.* streams and retries forever, so the
    # agent's output never lands on a page whose every ordinary request is authenticated fine.
    # Narrow on purpose: $gate_upgrade is empty for every non-upgrade request, so the cookie
    # authenticates a handshake and nothing else. It is not a session cookie for the site.
    # Not scoped to the two event paths: upstream answers an upgrade anywhere else with nothing
    # nginx can proxy (measured: 502), and naming paths here would break on an upstream rename.
    map $http_upgrade $gate_upgrade {
        default             '';
        ~*^websocket$       $cookie_dsh_gate;
    }

    # `off` is auth_basic's own literal for "no password needed here", hence a variable realm.
    map $gate_upgrade $gate_realm {
        default                 'DeepSeek Harness';
        '__DSH_GATE_TOKEN__'    off;
    }

    # Minted on authenticated responses not already carrying it, so a page that is about to open
    # a WebSocket always holds one. add_header skips an empty value, and skips 401s by default,
    # so only a request that passed basic auth is ever handed one.
    # HttpOnly: no script reads it. SameSite=Strict: keeps it off cross-site requests only, which
    # is not enough on its own; $gate_ws_deny below is what covers a same-site one.
    # No Secure: the basic-auth password crosses the same hop in the clear, so an HTTPS-only
    # cookie would protect nothing already exposed, and it would break a plain-HTTP docker run.
    map $cookie_dsh_gate $gate_set_cookie {
        default                 'dsh_gate=__DSH_GATE_TOKEN__; Path=/; HttpOnly; SameSite=Strict';
        '__DSH_GATE_TOKEN__'    '';
    }

    # The edge terminates TLS and speaks plain HTTP here, so $scheme is always http and comparing
    # it would refuse every real request. X-Forwarded-Proto is the scheme the browser used, and a
    # client forging it only makes its own Origin harder to match. Absent under a plain docker run,
    # where $scheme is then the right answer.
    map $http_x_forwarded_proto $gate_proto {
        default     $http_x_forwarded_proto;
        ''          $scheme;
    }

    # SameSite is scoped to the site, not the host, so a sibling deployment (another tenant here)
    # counts as same-site: its page's handshake carries this cookie, and cached basic credentials
    # with it. Origin is the check SameSite cannot make, being mandatory on a browser handshake
    # and unsettable from script. Compared whole, so scheme and port both count: cookies ignore
    # both, which makes another port, or plain HTTP on this hostname, the same case again.
    # A caseless regex, because no plain key compares two variables. No Origin at all means no
    # browser page (curl, the QA scripts), which still needs the password.
    map "$gate_proto://$http_host|$http_origin" $gate_foreign_origin {
        default                 1;
        '~*^([^|]+)\|\1$'       0;
        '~^[^|]+\|$'            0;
    }

    # Handshakes only: every other cross-origin read needs CORS, which nothing here grants.
    map "$connection_upgrade|$gate_foreign_origin" $gate_ws_deny {
        default             0;
        'upgrade|1'         1;
    }

    # The Origin rewrite below destroys upstream's own Origin check, and Sec-Fetch-Site cannot
    # carry the rest: an engine older than that header sends none, and a keyed-on-absent default
    # has to allow. So this keys on the origin check above, which every browser has always sent
    # on a state change, and refuses cross-site and same-site in one rule.
    map "$request_method|$gate_foreign_origin" $gate_csrf_deny {
        default        0;
        'POST|1'       1;
        'PUT|1'        1;
        'PATCH|1'      1;
        'DELETE|1'     1;
    }

    upstream harness {
        server 127.0.0.1:3080;
    }

    server {
        listen 0.0.0.0:8080;

        # dsh accepts base64 image attachments in the RPC body; nginx defaults to 1m. Deliberately
        # under upstream's 300 MiB, which its /api bridge buffers in memory, on a 1 GiB machine.
        client_max_body_size 64m;

        # Every request needs the password; a WebSocket handshake may present the cookie instead.
        auth_basic $gate_realm;
        auth_basic_user_file /run/dsh/htpasswd;
        add_header Set-Cookie $gate_set_cookie;

        location / {
            # The one sanctioned use of `if`: a bare return, no nesting. Both run before auth, so a
            # refused request never reaches the cookie or the password.
            if ($gate_csrf_deny) {
                return 403;
            }
            if ($gate_ws_deny) {
                return 403;
            }

            proxy_pass http://harness;
            proxy_http_version 1.1;

            # Load-bearing. The /api browser-trust fence pins the settings, credential and
            # model-discovery RPCs to a loopback Host with a same-origin Origin, and no
            # --trusted-host value unlocks them (they check against an empty trust list).
            # Normalizing both is what gets those RPCs past it. Only half of what the Settings
            # and Models pages need; the browser-side half is dealt with in the Dockerfile.
            proxy_set_header Host 127.0.0.1:3080;
            proxy_set_header Origin http://127.0.0.1:3080;

            # Sec-Fetch-Site is passed through so dsh can refuse cross-site too. Not relied on:
            # $gate_csrf_deny above does not need it, and an old engine sends none.

            # The gate credential is ours, not the app's, in both forms. Dropping Cookie costs
            # nothing: no package dsh ships reads one, so the only cookie in play is the gate's.
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Agent turns stream for minutes; buffering or a short read timeout truncates them.
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
