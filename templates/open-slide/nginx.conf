# The auth gate in front of the open-slide dev server, which has no authentication of its own and
# whose API writes files on request. Only this server faces the network; the dev server stays on
# 127.0.0.1:5173.
# Rendered at boot: entrypoint.sh substitutes __OPEN_SLIDE_GATE_TOKEN__ with a digest of the admin
# credentials. The token must be a literal here because nginx can only compare strings, not hash one.

user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;
    default_type application/octet-stream;
    include /etc/nginx/mime.types;

    # The gate maps key on a 64-character digest, which does not fit the default 64-byte bucket.
    # Load-bearing: nginx refuses to start rather than degrade, leaving the dev server up behind
    # no listener.
    map_hash_bucket_size 128;

    # Vite's HMR channel is a WebSocket, and the editor needs it: a slide edit, a new deck and an
    # uploaded asset all reach the open page as an HMR message.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Why a cookie exists at all: `new WebSocket()` takes no headers, so only credentials the
    # engine attaches by itself can authenticate a handshake, and nothing requires it to reuse its
    # HTTP auth cache there. Measured by the dsh template with a page holding valid basic
    # credentials, Chromium and Firefox attach them and WebKit sends none. Where they are not
    # attached the handshake 401s, and Vite's client then reports a dead connection on a page whose
    # every ordinary request is authenticated fine: edits land on disk and the page never moves.
    # Narrow on purpose: $gate_upgrade is empty for every non-upgrade request, so the cookie
    # authenticates a handshake and nothing else. It is not a session cookie for the site.
    map $http_upgrade $gate_upgrade {
        default             '';
        ~*^websocket$       $cookie_open_slide_gate;
    }

    # `off` is auth_basic's own literal for "no password needed here", hence a variable realm.
    map $gate_upgrade $gate_realm {
        default                     'open-slide';
        '__OPEN_SLIDE_GATE_TOKEN__' off;
    }

    # Minted on authenticated responses not already carrying it, so a page that is about to open a
    # WebSocket always holds one. add_header skips an empty value, and skips 401s by default, so
    # only a request that passed basic auth is ever handed one.
    # HttpOnly: no script reads it. SameSite=Strict keeps it off cross-site requests, which is not
    # enough on its own; $gate_ws_deny below is what covers a same-site one.
    # No Secure: the basic-auth password crosses the same hop in the clear, so an HTTPS-only cookie
    # would protect nothing already exposed, and it would break a plain-HTTP docker run.
    map $cookie_open_slide_gate $gate_set_cookie {
        default                     'open_slide_gate=__OPEN_SLIDE_GATE_TOKEN__; Path=/; HttpOnly; SameSite=Strict';
        '__OPEN_SLIDE_GATE_TOKEN__' '';
    }

    # The platform terminates TLS and proxies plain HTTP here, setting X-Forwarded-Proto: https.
    # Forward that value rather than nginx's own $scheme, because the dev server's mutation guard
    # rebuilds the page's origin from it and would refuse every write as a cross-origin one.
    # Fall back to $scheme if the edge ever sends none, which is also the plain docker run case.
    map $http_x_forwarded_proto $gate_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # SameSite is scoped to the site, not the host, so a sibling deployment (another tenant here)
    # counts as same-site: its page's handshake carries this cookie, and cached basic credentials
    # with it. Origin is the check SameSite cannot make, being mandatory on a browser handshake and
    # unsettable from script. Compared whole, so scheme and port both count: cookies ignore both.
    # A caseless regex, because no plain key compares two variables. No Origin at all means no
    # browser page (curl, a probe), which still needs the password.
    map "$gate_proto://$http_host|$http_origin" $gate_foreign_origin {
        default             1;
        '~*^([^|]+)\|\1$'   0;
        '~^[^|]+\|$'        0;
    }

    # Handshakes only. Every other cross-origin read needs CORS, which nothing here grants, and
    # every cross-origin write is refused by the dev server's own guard.
    map "$connection_upgrade|$gate_foreign_origin" $gate_ws_deny {
        default         0;
        'upgrade|1'     1;
    }

    upstream open_slide {
        server 127.0.0.1:5173;
    }

    server {
        listen 0.0.0.0:8080;

        # Asset uploads arrive as a raw body. The dev server refuses anything over 25 MB itself,
        # with a message naming that limit; leaving room above it means that message is what a
        # user sees instead of nginx's own 413.
        client_max_body_size 32m;

        # Every request needs the password; a WebSocket handshake may present the cookie instead.
        auth_basic $gate_realm;
        auth_basic_user_file /run/open-slide/htpasswd;
        add_header Set-Cookie $gate_set_cookie;

        location / {
            # The one sanctioned use of `if`: a bare return, no nesting. It runs before auth, so a
            # refused handshake never reaches the cookie or the password.
            if ($gate_ws_deny) {
                return 403;
            }

            proxy_pass http://open_slide;
            proxy_http_version 1.1;

            # Host passes through untouched, and Origin is not set at all, because the dev server
            # compares the two itself on every write and refuses a cross-site one. That comparison
            # is the CSRF defence for /__edit, /__slides, /__assets and /__comments, all of which
            # a browser would otherwise reach with its cached basic credentials. Rewriting either
            # header would disarm it.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $gate_proto;

            # The gate credential is ours, not the app's, in both forms. Dropping Cookie costs
            # nothing: the app keeps its UI state in localStorage and reads no cookie, so the only
            # cookie in play is the gate's.
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # HMR holds the socket open for as long as the page is; the default 60s read timeout
            # would drop it every minute and the editor would reconnect in a loop.
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
