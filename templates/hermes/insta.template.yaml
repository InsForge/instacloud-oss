code: hermes
version: 2.4.0
maintainer: official
sourceRepo: InsForge/insta-oss

upstream:
  repo: NousResearch/hermes-agent
  image: docker.io/nousresearch/hermes-agent
  pinned: v2026.9.24
  license: MIT

# Declare once, reference many: one generated value can be reused across services and vars
generated:
  gateway_token: secret:64
  # Telegram signs every webhook update with this; the gateway refuses to start webhook mode
  # without one. Only the machine and Telegram ever see it, so a minted value is the right kind.
  telegram_webhook_secret: secret:32

services:
  hermes:
    type: web
    image: ghcr.io/insforge/insta-oss/templates/hermes:2.4.0   # built from ./Dockerfile by templates-build-images.yml
    port: 8080
    healthcheck: /api/status
    # No alwaysOn since 2.4.0: the dashboard is reached INBOUND, Telegram arrives on an INBOUND
    # webhook (TELEGRAM_WEBHOOK_URL below) and so does Slack (SLACK_EVENTS_URL below; this image
    # runs Slack over the Events API only, Socket Mode is not offered), all traffic the platform's
    # router can see and wake a stopped machine for, so the platform's scale-to-zero default
    # applies. Discord (gateway) is an OUTBOUND connection the router never sees: on a
    # scaled-to-zero machine it drops when the machine stops and cannot wake it, so a Discord
    # deployment must turn always-on on from the console. The README's scale-to-zero section and
    # the variable descriptions below say so.
    volume: true
    env:
      fixed:
        HERMES_HOME: /data/.hermes
        # The dashboard listens on 8081, a port the platform does not route, behind nginx, which
        # owns the routed port 8080 and publishes the Telegram and Slack webhook paths beside it.
        # See nginx.conf and the bind note in entrypoint.sh.
        HERMES_DASHBOARD_PORT: "8081"
        # The gateway registers this URL with Telegram on connect and serves it on the loopback
        # port below; nginx forwards /telegram there. Inert until a Telegram bot token is set,
        # whether at deploy time or later from the dashboard's Channels page.
        TELEGRAM_WEBHOOK_URL: ${services.hermes.url}/telegram
        TELEGRAM_WEBHOOK_PORT: "8443"
        TELEGRAM_WEBHOOK_HOST: 127.0.0.1
        # Slack's Events API request URL, served by the patched adapter (see the Dockerfile) on the
        # loopback port below; nginx forwards /slack/events there. With this set, a Slack bot token
        # without SLACK_SIGNING_SECRET is a configuration error the gateway reports by name instead
        # of silently falling back to Socket Mode. Unlike Telegram, Slack does not learn this URL
        # from the bot: the operator pastes it into the Slack app's Event Subscriptions page, where
        # Slack verifies it on the spot (the README and the dashboard's Channels page walk through it).
        SLACK_EVENTS_URL: ${services.hermes.url}/slack/events
        SLACK_EVENTS_PORT: "8444"
        SLACK_EVENTS_HOST: 127.0.0.1
      generated:
        HERMES_GATEWAY_TOKEN: ${gateway_token}
        TELEGRAM_WEBHOOK_SECRET: ${telegram_webhook_secret}
      required:
        # Neither a `default:` nor a `generate:`, matching the other agent UIs: the operator types
        # both or does not deploy. A generated password would be one NOBODY can read back, since a
        # template variable is stored write-only, and a cleared field silently mints another.
        ADMIN_USERNAME:
          description: "Username for the dashboard sign-in. Pick your own; it may not contain a colon or start with a dash"
        ADMIN_PASSWORD:
          description: "Password for the dashboard sign-in. Pick a strong one: it is all that stands between the URL and an agent holding your API keys"
      # Everything else is optional and dashboard-configurable after deploy: provider keys live on
      # the API Keys page, and the Channels page configures any of the ~17 supported messaging
      # platforms, with a restart button that applies them. The variables declared here are a
      # deploy-form convenience for people who already hold the value.
      optional:
        OPENROUTER_API_KEY:
          description: "OpenRouter API key the agent uses for model calls (openrouter.ai/keys). Leave blank to add it later on the dashboard's API Keys page; chat starts answering once a provider key is set"
        TELEGRAM_BOT_TOKEN:
          description: "Telegram bot token, created with @BotFather. Telegram connects over an inbound webhook, so this channel keeps working on a scale-to-zero machine. Leave blank to connect channels later from the dashboard's Channels page"
        TELEGRAM_ALLOWED_USERS:
          # The adapter compares user ids and never reads usernames; the old wording silently locked owners out.
          description: "Comma-separated numeric Telegram user IDs allowed to use the bot (not @usernames; get yours from @userinfobot)"
        DISCORD_BOT_TOKEN:
          description: "Discord bot token from the Discord Developer Portal. Discord needs an always-on machine (it delivers messages over a connection the bot opens). Leave blank to connect channels later from the dashboard"
        DISCORD_ALLOWED_USERS:
          description: "Comma-separated numeric Discord user IDs allowed to use the bot"
        SLACK_BOT_TOKEN:
          description: "Slack bot token (xoxb-...) from OAuth & Permissions. Slack events reach this deployment over Slack's inbound Events API, so the bot keeps working on a scale-to-zero machine; SLACK_SIGNING_SECRET is needed with it"
        SLACK_SIGNING_SECRET:
          description: "Slack app signing secret (Basic Information > App Credentials). After deploy, point the app's Event Subscriptions request URL at <service URL>/slack/events and turn Socket Mode off in the Slack app; the dashboard's Channels page shows the exact URL"
        SLACK_ALLOWED_USERS:
          description: "Comma-separated Slack member IDs allowed to use the bot (e.g. U01ABC2DEF3)"

# No provider oneOf: every provider key is optional, the dashboard's API Keys page sets any of
# them after deploy. Upstream DOES document ~30 provider env names (this note used to claim
# otherwise); pinning a model needs `hermes config set model.default`.
# No channel oneOf either, deliberately: with zero channels the gateway idles (verified on
# v2026.8.16 and v2026.8.27: it logs "No messaging platforms enabled." and keeps running) and the
# dashboard's browser chat is a full channel on its own, so an empty deploy is usable, not broken.

meta:
  name: Hermes Agent
  tagline: Autonomous AI agent from Nous Research with multi-channel messaging
  category: ai-agent
  tags: [ai-agent, ai]
  # Architectures the published image carries. A box on anything else is told at deploy time
  # rather than left to fail on the pull: upstream publishes both and this image only adds an
  # entrypoint.
  architectures: [amd64, arm64]
  logo: ./logo.png              # 512x512, real transparency; see the attribution table in ../README.md
  links:
    upstream: https://github.com/NousResearch/hermes-agent
    documentation: https://hermes-agent.nousresearch.com/docs/
