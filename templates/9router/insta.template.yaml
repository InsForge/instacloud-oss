code: 9router
version: 1.2.2
maintainer: official
sourceRepo: InsForge/insta-oss

upstream:
  repo: decolua/9router
  image: docker.io/decolua/9router
  pinned: "0.5.55"              # never latest: Railway's version floats on it and drifts on every restart
  license: MIT

services:
  router:
    type: web
    image: ghcr.io/insforge/insta-oss/templates/9router:1.2.2   # built from ./Dockerfile by templates-build-images.yml
    port: 20128
    healthcheck: /api/health    # / is a 307 redirect chain and never satisfies the deploy health gate
    volume: true  # DATA_DIR points provider keys, accounts, and jwt-secret at it
    env:
      fixed:
        DATA_DIR: /data
      required:
        INITIAL_PASSWORD:
          # Deliberately not generated: this is the password the user types on every dashboard
          # login, and the app refuses its built-in default (123456) on remote logins outright.
          description: "Dashboard login password. The app rejects its built-in default on remote logins, so this must be set here"

meta:
  name: 9Router
  tagline: Self-hosted LLM router with fallback across 40+ providers
  category: llm
  tags: [llm, ai]
  # Architectures the published image carries. A box on anything else is told at deploy time
  # rather than left to fail on the pull: the base pin is the multi-arch index, and both arches
  # build and start.
  architectures: [amd64, arm64]
  logo: ./logo.png              # 500x500, real transparency; see the attribution table in ../README.md
  links:
    upstream: https://github.com/decolua/9router
