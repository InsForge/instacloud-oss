# The one process facing the network. It makes the same splits upstream's Traefik makes across six
# containers (contrib/docker/docker-compose.prod.yaml), except that here every upstream is a port
# on loopback, and it adds the password gate WorkAdventure has no equivalent of.
#
# Rendered at boot: entrypoint.sh substitutes __WA_GATE_TOKEN__ with a digest of the admin
# credentials. The token must be a literal here because nginx can only compare strings, not hash one.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    access_log off;
    server_tokens off;
    default_type application/octet-stream;
    include /etc/nginx/mime.types;

    sendfile on;
    # The game ships one large JS bundle and a pile of tilesets; the defaults truncate those headers
    # on a 304 round-trip and cost a re-download of the whole bundle on every reload.
    proxy_buffers 16 32k;
    proxy_buffer_size 32k;

    # The gate map keys on a 64-character digest, which does not fit the default 64-byte bucket.
    # Load-bearing: nginx refuses to start rather than degrade, which would leave the stack up
    # behind no listener.
    map_hash_bucket_size 128;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Why a cookie exists at all: `new WebSocket()` takes no headers, so only credentials the engine
    # attaches by itself can authenticate a handshake, and nothing requires it to reuse its HTTP
    # auth cache there. The game's whole session is that one socket: without it the page renders,
    # the Woka picker works, and entering the map hangs forever on "Connecting".
    # Narrow on purpose: $gate_upgrade is empty for every non-upgrade request, so the cookie
    # authenticates a handshake and nothing else. It is not a session cookie for the site.
    map $http_upgrade $gate_upgrade {
        default             '';
        ~*^websocket$       $cookie_wa_gate;
    }

    # `off` is auth_basic's own literal for "no password needed here", hence a variable realm.
    map $gate_upgrade $gate_realm {
        default             'WorkAdventure';
        '__WA_GATE_TOKEN__' off;
    }

    # Minted on authenticated responses not already carrying it, so a page that is about to open the
    # game socket always holds one. add_header skips an empty value, and skips 401s by default, so
    # only a request that passed basic auth is ever handed one.
    # No Secure: the basic-auth password crosses the same hop in the clear, so an HTTPS-only cookie
    # would protect nothing already exposed, and it would break a plain `docker run`.
    map $cookie_wa_gate $gate_set_cookie {
        default             'wa_gate=__WA_GATE_TOKEN__; Path=/; HttpOnly; SameSite=Strict';
        '__WA_GATE_TOKEN__' '';
    }

    # The platform terminates TLS and proxies plain HTTP here, setting X-Forwarded-Proto: https.
    # map-storage runs `app.set("trust proxy", true)` and rebuilds the URL a map-editor JWT is
    # checked against from this header and the host; nginx's own $scheme would make every saved
    # edit fail its signature check. Fall back to $scheme if the edge ever sends none, which is
    # also the plain `docker run` case.
    map $http_x_forwarded_proto $gate_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $http_x_forwarded_host $gate_host {
        default $http_x_forwarded_host;
        ''      $http_host;
    }

    # SameSite is scoped to the site, not the host, so a sibling deployment on this platform counts
    # as same-site: its page's handshake would carry this cookie. Origin is the check SameSite
    # cannot make, being mandatory on a browser handshake and unsettable from script. Compared
    # whole, so scheme and port both count. No Origin at all means no browser page (curl, a probe),
    # which still needs the password.
    map "$gate_proto://$gate_host|$http_origin" $gate_foreign_origin {
        default             1;
        '~*^([^|]+)\|\1$'   0;
        '~^[^|]+\|$'        0;
    }

    map "$connection_upgrade|$gate_foreign_origin" $gate_ws_deny {
        default         0;
        'upgrade|1'     1;
    }

    # play serves the game and the pusher's HTTP API. PUSHER_HTTP_PORT in the manifest.
    upstream wa_play {
        server 127.0.0.1:3100;
    }

    # play's second listener, the game's own WebSocket. PUSHER_WS_PORT in the manifest.
    upstream wa_play_ws {
        server 127.0.0.1:3101;
    }

    # back's HTTP side. HTTP_PORT in the manifest; its gRPC side is reached on loopback by play.
    upstream wa_back {
        server 127.0.0.1:8081;
    }

    # map-storage's HTTP port is hardcoded to 3000 in map-storage/src/index.ts.
    upstream wa_map_storage {
        server 127.0.0.1:3000;
    }

    upstream wa_icon {
        server 127.0.0.1:8082;
    }

    server {
        listen 0.0.0.0:8080;

        client_max_body_size 512m;

        # Every request needs the password; the game's WebSocket handshake may present the cookie
        # instead, and the two locations below need neither.
        auth_basic $gate_realm;
        auth_basic_user_file /run/workadventure/htpasswd;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gate_proto;
        proxy_set_header X-Forwarded-Host $gate_host;
        # Authorization is forwarded, which looks wrong for a gate credential and is not optional:
        # play's front sends its own session JWT in that header, raw and unprefixed, from
        # WokaSelectScene.svelte and the other AuthenticatedProvider endpoints. Clearing it (the
        # tidier choice, and what this file did first) made /woka/list answer 401, so the avatar
        # picker spun forever on a page whose every other request was fine. Cookie is forwarded for
        # the same kind of reason: play sets playUri and authToken on the OIDC paths.
        # What it costs: play sees `Basic <gate credential>` on requests where the front sets no
        # header of its own. It reads none of them, but the header is in the proxied request.

        # The platform's health gate. No password: a 401 would pass it just as well, but then a
        # green deploy would only mean nginx started. This reaches play's own /ping.
        location = /ping {
            auth_basic off;
            proxy_pass http://wa_play;
        }

        # Entity collections for the map editor's palette, served out of play's static files.
        # No password because map-storage fetches these URLs itself, server to server, when a map
        # is uploaded: ENTITY_COLLECTION_URLS in the manifest is the public address, because the
        # URLs are also written into the resulting .wam for the browser to load later. They are
        # upstream's published furniture lists and hold nothing about this deployment.
        location ^~ /collections/ {
            auth_basic off;
            proxy_pass http://wa_play;
        }

        # The tab icon, served out of play's static files. No password because a browser fetches a
        # favicon from a network context that carries no basic credentials: Chromium logged a 401
        # for this exact path on an otherwise fully authenticated page. Upstream's published mark,
        # and it holds nothing about this deployment.
        location ^~ /static/images/favicons/ {
            auth_basic off;
            proxy_pass http://wa_play;
        }

        # The game's socket. Everything a session does after the Woka picker rides on this one
        # connection, so the read timeout has to outlast a quiet room rather than the default 60s.
        location ^~ /ws/ {
            # The one sanctioned use of `if`: a bare return, no nesting. It runs before auth, so a
            # refused handshake never reaches the cookie or the password.
            if ($gate_ws_deny) {
                return 403;
            }

            proxy_pass http://wa_play_ws;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # back's HTTP API, the way upstream's `strip-api-prefix` middleware presents it.
        location ^~ /api/ {
            proxy_pass http://wa_back/;
        }

        location = /api {
            proxy_pass http://wa_back/;
        }

        # map-storage, with the prefix stripped the way upstream's `strip-map-storage-prefix` does.
        # It is told the prefix separately, as PATH_PREFIX, which is how it builds its own URLs.
        location ^~ /map-storage/ {
            proxy_pass http://wa_map_storage/;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /map-storage {
            return 301 /map-storage/;
        }

        # Favicons for websites opened inside the game, stripped the way upstream's
        # `strip-icon-prefix` does. /lettericons is iconserver's own redirect target and is NOT
        # stripped, the same split upstream's Compose makes.
        location ^~ /icon/ {
            proxy_pass http://wa_icon/;
        }

        location ^~ /lettericons/ {
            proxy_pass http://wa_icon;
        }

        # play's validator demands an UPLOADER_URL and this image ships no uploader container, so
        # the route exists and says so rather than 404ing as if the path were a typo. Nothing calls
        # it: ENABLE_CHAT_UPLOAD is false.
        location ^~ /uploader {
            return 501;
        }

        # The game page and its assets, and the only place the gate cookie is minted. Minting it at
        # server level instead would hand one to anyone who called /ping, which needs no password,
        # and that cookie is the whole credential for the WebSocket handshake.
        location / {
            add_header Set-Cookie $gate_set_cookie;
            proxy_pass http://wa_play;
        }
    }
}
