# The browser terminal's tmux. A ~/.tmux.conf on the volume is read after this and wins.
set -g default-shell /bin/bash
# The wheel scrolls tmux history instead of sending arrow keys. Shift+drag (Option on a Mac) selects.
set -g mouse on
set -g history-limit 50000
# The 500ms default makes Esc, which interrupts the agent, feel stuck.
set -sg escape-time 10
set -g default-terminal screen-256color
