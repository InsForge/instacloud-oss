# One routed port in front of two things: the Expo web bundle, and the OpenMuse API on loopback.
# The bundle calls the API with same-origin relative paths (see the Dockerfile), so this file is
# what makes `/` the app and `/api/*` the server.
user www-data;
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;
  # The API refuses anything over 12 MB itself, with a message naming the PDF limit. Leaving room
  # above it means that message is what a user sees, instead of nginx's own 413.
  client_max_body_size 16m;

  # The platform terminates TLS and proxies plain HTTP to nginx, setting X-Forwarded-Proto: https.
  # Forward that value rather than nginx's own $scheme (http), so OAuth callbacks, redirects and
  # secure cookies see the public HTTPS origin. Fall back to $scheme if the edge ever sends none.
  map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
  }

  server {
    listen 8080 default_server;
    server_name _;

    # No basic auth here: in live mode OpenMuse carries its own, and layering nginx's on top was
    # what made the app hang. The two use the same `Authorization` header, so the app's
    # `Bearer <session>` replaced the browser's cached basic credential on every XHR, and a 401 on
    # an XHR is a prompt the browser cannot show -- the page sat on "Opening your workspace..."
    # forever. OpenMuse's own auth is the gate instead: POST /api/session is checked against the
    # 24-char OPENMUSE_ACCESS_KEY (timing-safe), and every other /api call needs the Bearer session
    # it mints. nginx only routes.
    location /api/ {
      proxy_pass http://127.0.0.1:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "";
      # Chat is AG-UI over SSE. Buffering holds the whole stream until it ends, which reads as an
      # agent that never answers.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location / {
      root /srv/web;
      # Expo exports a single-page app: every route that is not a file is index.html.
      try_files $uri $uri/ /index.html;
    }
  }
}
