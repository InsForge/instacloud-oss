code: pi
version: 0.8.3
maintainer: official
sourceRepo: InsForge/insta-oss

upstream:
  repo: earendil-works/pi
  package: "@earendil-works/pi-coding-agent"
  pinned: "0.84.2"
  license: MIT

services:
  # Named for the template, not "workspace": three templates sharing one service name collided on
  # the same branch, the second overwriting the first (QA.md finding 1).
  pi:
    type: web
    image: ghcr.io/insforge/insta-oss/templates/pi:0.8.3   # built from ./Dockerfile by templates-build-images.yml
    port: 7681
    healthcheck: /
    # No alwaysOn: the browser reaches this INBOUND, so wake-on-request works (hermes and n8n
    # cannot). Costs a ~25s cold boot, and an agent left running with no browser is stopped.
    volume: true
    env:
      fixed:
        HOME: /data/home
      required:
        # Neither a `default:` nor a `generate:`, so the deploy form shows two empty required fields
        # and cannot be submitted until the operator fills them. That is deliberate: this service is
        # a root shell in a browser, and a credential shipped in this file would be the same one on
        # every deploy in the world. Nothing here can be left to a fallback.
        ADMIN_USERNAME:
          description: "Username for the browser terminal sign-in"
        ADMIN_PASSWORD:
          description: "Password for the browser terminal sign-in"
      # Pi reads a provider key straight from the environment and picks the model accordingly; its
      # own env-api-keys.js recognises 37 providers across 35 variables. These three are the ones
      # worth a form field. Any one is enough, and none is fine too: a key can be added later from
      # inside the terminal, and the rest still work as plain service variables.
      optional:
        ANTHROPIC_API_KEY:
          description: "Anthropic API key, for Claude models"
        OPENAI_API_KEY:
          description: "OpenAI API key, for GPT models"
        OPENROUTER_API_KEY:
          description: "OpenRouter API key, for whichever model you route to"

meta:
  name: Pi Coding Agent
  tagline: Coding agent CLI with session history and a browser terminal
  category: ai-agent
  tags: [ai-agent, ai]
  # Architectures the published image carries. A box on anything else is told at deploy time
  # rather than left to fail on the pull: the node base and the ttyd asset both carry aarch64, and
  # both arches build and start.
  architectures: [amd64, arm64]
  logo: ./logo.svg              # pi.dev's own mark; adapts to dark mode via prefers-color-scheme
  links:
    upstream: https://github.com/earendil-works/pi
