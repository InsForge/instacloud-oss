code: hermes
version: 2.3.2
maintainer: official
sourceRepo: InsForge/insta-oss

upstream:
  repo: NousResearch/hermes-agent
  image: docker.io/nousresearch/hermes-agent
  pinned: v2026.8.27
  license: MIT

# Declare once, reference many: one generated value can be reused across services and vars
generated:
  gateway_token: secret:64

services:
  hermes:
    type: web
    image: ghcr.io/insforge/insta-oss/templates/hermes:2.3.2   # built from ./Dockerfile by templates-build-images.yml
    port: 8080
    healthcheck: /api/status
    # Channels arrive on OUTBOUND connections (Telegram long poll, Slack Socket Mode, ...),
    # so an idle machine stops and nothing can wake it.
    alwaysOn: true
    volume: true
    env:
      fixed:
        HERMES_HOME: /data/.hermes
        HERMES_DASHBOARD_PORT: "8080"
      generated:
        HERMES_GATEWAY_TOKEN: ${gateway_token}
      required:
        # Neither a `default:` nor a `generate:`, matching the other agent UIs: the operator types
        # both or does not deploy. A generated password would be one NOBODY can read back, since a
        # template variable is stored write-only, and a cleared field silently mints another.
        ADMIN_USERNAME:
          description: "Username for the dashboard sign-in. Pick your own; it may not contain a colon or start with a dash"
        ADMIN_PASSWORD:
          description: "Password for the dashboard sign-in. Pick a strong one: it is all that stands between the URL and an agent holding your API keys"
      # Everything else is optional and dashboard-configurable after deploy: provider keys live on
      # the API Keys page, and the Channels page configures any of the ~17 supported messaging
      # platforms, with a restart button that applies them. The variables declared here are a
      # deploy-form convenience for people who already hold the value.
      optional:
        OPENROUTER_API_KEY:
          description: "OpenRouter API key the agent uses for model calls (openrouter.ai/keys). Leave blank to add it later on the dashboard's API Keys page; chat starts answering once a provider key is set"
        TELEGRAM_BOT_TOKEN:
          description: "Telegram bot token, created with @BotFather. Leave blank to connect channels later from the dashboard's Channels page"
        TELEGRAM_ALLOWED_USERS:
          # The adapter compares user ids and never reads usernames; the old wording silently locked owners out.
          description: "Comma-separated numeric Telegram user IDs allowed to use the bot (not @usernames; get yours from @userinfobot)"
        DISCORD_BOT_TOKEN:
          description: "Discord bot token from the Discord Developer Portal. Leave blank to connect channels later from the dashboard"
        DISCORD_ALLOWED_USERS:
          description: "Comma-separated numeric Discord user IDs allowed to use the bot"
        SLACK_BOT_TOKEN:
          description: "Slack bot token (xoxb-...). Slack needs SLACK_APP_TOKEN too; both can also be set later from the dashboard"
        SLACK_APP_TOKEN:
          description: "Slack app-level token (xapp-...) for Socket Mode; pairs with SLACK_BOT_TOKEN"
        SLACK_ALLOWED_USERS:
          description: "Comma-separated Slack member IDs allowed to use the bot (e.g. U01ABC2DEF3)"

# No provider oneOf: every provider key is optional, the dashboard's API Keys page sets any of
# them after deploy. Upstream DOES document ~30 provider env names (this note used to claim
# otherwise); pinning a model needs `hermes config set model.default`.
# No channel oneOf either, deliberately: with zero channels the gateway idles (verified on
# v2026.8.16 and v2026.8.27: it logs "No messaging platforms enabled." and keeps running) and the
# dashboard's browser chat is a full channel on its own, so an empty deploy is usable, not broken.

meta:
  name: Hermes Agent
  tagline: Autonomous AI agent from Nous Research with multi-channel messaging
  category: ai-agent
  tags: [ai-agent, ai]
  # Architectures the published image carries. A box on anything else is told at deploy time
  # rather than left to fail on the pull: upstream publishes both and this image only adds an
  # entrypoint.
  architectures: [amd64, arm64]
  logo: ./logo.png              # 512x512, real transparency; see the attribution table in ../README.md
  links:
    upstream: https://github.com/NousResearch/hermes-agent
    documentation: https://hermes-agent.nousresearch.com/docs/
