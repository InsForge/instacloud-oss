# The one listener the platform routes (8080), shared by two upstreams:
#   /telegram        the gateway's Telegram webhook server (127.0.0.1:8443). Telegram reaches it
#                    with its own secret token, so it must never sit behind the dashboard's sign-in.
#                    An inbound update is also what wakes a scaled-to-zero machine: the platform
#                    counts traffic through the router, and a long poll the gateway opened itself
#                    is invisible to it.
#   /slack/events    the gateway's Slack Events API listener (127.0.0.1:8444), same reasoning:
#                    Slack signs each request with the app's signing secret, and an inbound event
#                    wakes the machine. Only active when SLACK_SIGNING_SECRET is set (see the
#                    Dockerfile's patch); otherwise nothing listens there and the route answers 502.
#   everything else  the dashboard on 8081 (bound 0.0.0.0 on purpose: a loopback bind makes
#                    upstream drop its sign-in gate; see entrypoint.sh), which keeps its own auth.
# Upstream's s6 runs the CMD service as the unprivileged hermes user, so nothing here may touch
# /run or /var/lib/nginx: the pid file and every temp path live under /tmp/hermes-nginx, which the
# entrypoint creates. No `user` directive either: nginx refuses it when the master is not root.
worker_processes 1;
error_log stderr warn;
pid /tmp/hermes-nginx/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;
    default_type application/octet-stream;
    include /etc/nginx/mime.types;

    # All five are set, not just the ones this config uses: nginx creates every temp directory at
    # startup and exits if it cannot, so an unset one fails the boot rather than the request that
    # would have needed it.
    client_body_temp_path /tmp/hermes-nginx/body;
    proxy_temp_path /tmp/hermes-nginx/proxy;
    fastcgi_temp_path /tmp/hermes-nginx/fastcgi;
    scgi_temp_path /tmp/hermes-nginx/scgi;
    uwsgi_temp_path /tmp/hermes-nginx/uwsgi;

    # The dashboard's chat, terminal and event streams all upgrade to WebSocket.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The edge terminates TLS and speaks plain HTTP here, so $scheme is always http. Forward the
    # scheme the browser used when the edge says so; under a plain docker run there is no edge and
    # $scheme is the right answer.
    map $http_x_forwarded_proto $forwarded_proto {
        default     $http_x_forwarded_proto;
        ''          $scheme;
    }

    server {
        listen 0.0.0.0:8080;

        # Files handed to the agent from the dashboard, and media Telegram forwards.
        client_max_body_size 64m;

        # Exact match: the gateway serves this one path on that port and nothing else.
        location = /telegram {
            proxy_pass http://127.0.0.1:8443;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Exact match again: Slack posts events, interactive payloads and the url_verification
        # challenge to this one URL.
        location = /slack/events {
            proxy_pass http://127.0.0.1:8444;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # An idle chat or terminal socket carries nothing for minutes at a time; the default
            # 60s read timeout would cut it mid-session.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }
    }
}
